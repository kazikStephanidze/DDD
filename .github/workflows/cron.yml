name: Scheduled Bot Broadcasts

on:
  schedule:
    # Run every 5 minutes 24/7 to clean up expired bot messages and trigger 10:00-21:00 scheduled broadcasts
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-scheduled-cron
  cancel-in-progress: false

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron on Vercel
        env:
          CRON_URL: ${{ vars.BOT_CRON_URL || 'https://ddd-six-eta.vercel.app/api/cron' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl --fail-with-body -sS -m 55 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$CRON_URL"
          else
            curl --fail-with-body -sS -m 55 "$CRON_URL"
          fi
